version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mcp-server:
    build: ./apps/mcp-server
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
    ports:
      - "3001:3001"

  backend:
    build: ./apps/backend
    depends_on:
      - mongodb
      - mcp-server
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/film_for_you
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5000:5000"

  web:
    build: ./apps/web
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
